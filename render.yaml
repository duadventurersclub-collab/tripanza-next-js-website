services:
  - type: web
    name: tripanza-nextjs-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:whatsapp
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_WORDPRESS_URL
        sync: false
      - key: WORDPRESS_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: REVALIDATION_SECRET
        sync: false
      # Free-mode sessions are temporary and may need QR re-pairing after restart.
      # The bot remains disabled until its server-only secrets and ENABLED=true are configured.
      - key: TRIPANZA_WHATSAPP_AUTH_DIR
        value: /tmp/tripanza-whatsapp
      - key: TRIPANZA_WHATSAPP_ALLOW_EPHEMERAL_AUTH
        value: "yes"
      - key: TRIPANZA_WHATSAPP_KEEP_AWAKE
        value: "true"
