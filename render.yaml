services:
  - type: web
    name: tripanza-nextjs-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_WORDPRESS_URL
        sync: false
